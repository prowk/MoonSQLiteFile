name: Pages demo

# 只允许在获准部署后手动运行，推送源码不会自动公开部署。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 已审查且通过 CI 的提交或 tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.2'
      - name: Install fixed acceptance environment
        run: |
          version=$(python -c "import json; print(json.load(open('tools/toolchain.json'))['install_version'])")
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          npm install --prefix _build/browser-tools --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node _build/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
          npm install --prefix _build/type-tools --no-audit --no-fund --ignore-scripts typescript@5.9.3
      - name: Verify exact deployment content
        env:
          MOONSQLITE_PLAYWRIGHT: ${{ github.workspace }}/_build/browser-tools/node_modules/playwright
        run: python tools/verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified demo
        id: deployment
        uses: actions/deploy-pages@v4
