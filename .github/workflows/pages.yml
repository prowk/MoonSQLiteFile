name: Pages demo

# 只允许在获准部署后手动运行，推送源码不会自动公开部署。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 已审查且通过 CI 的提交或 tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-acceptance
      - name: Verify exact deployment content
        run: python tools/verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified demo
        id: deployment
        uses: actions/deploy-pages@v4
