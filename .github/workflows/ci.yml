name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon fmt --check
      - name: Verify historical public API and generated interface
        run: python tools/verify_api.py
      - name: Verify committed fixture bytes
        run: python tools/generate_fixtures.py --check
      - name: Compare CLI against SQLite oracle
        run: python tools/verify_oracle.py
      - name: Verify index and WITHOUT ROWID fixtures
        run: python tools/generate_btree_fixtures.py --check
      - name: Compare complete B-tree records against SQLite
        run: python tools/verify_btree_oracle.py
      - name: Verify database ownership reports against SQLite
        run: python tools/verify_inspection.py
      - name: Compare WAL committed snapshots against SQLite
        run: python tools/verify_wal_oracle.py
      - name: Run library example
        run: moon run --target js examples/basic
      - name: Verify packaged library in a separate consumer workspace
        run: python tools/verify_consumer.py
      - name: Build and verify standalone offline viewer
        run: |
          python tools/build_viewer.py
          node tools/verify_viewer.cjs
      - name: Run bounded reproducible fuzzing
        run: node tools/fuzz.cjs --seed 20261003 --iterations 512
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: _build/fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
