name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - name: Install pinned browser acceptance tools
        run: |
          npm install --prefix _build/browser-tools --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node _build/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon fmt --check
      - name: Verify historical public API and generated interface
        run: python tools/verify_api.py
      - name: Verify committed fixture bytes
        run: python tools/generate_fixtures.py --check
      - name: Compare CLI against SQLite oracle
        run: python tools/verify_oracle.py
      - name: Verify index and WITHOUT ROWID fixtures
        run: python tools/generate_btree_fixtures.py --check
      - name: Compare complete B-tree records against SQLite
        run: python tools/verify_btree_oracle.py
      - name: Verify database ownership reports against SQLite
        run: python tools/verify_inspection.py
      - name: Compare WAL committed snapshots against SQLite
        run: python tools/verify_wal_oracle.py
      - name: Verify reviewed SQLite regressions
        run: python tools/verify_review.py
      - name: Verify bounded file I/O and sparse 2 GiB reads
        run: node tools/verify_range_io.cjs
      - name: Verify valid WAL frame offsets beyond 2 GiB
        run: node tools/verify_wide_wal.cjs
      - name: Verify large payload budgets and UInt64 CLI options
        run: python tools/verify_large_payload.py
      - name: Verify repeated-page WAL benchmark and record I/O costs
        run: python tools/benchmark_io.py
      - name: Run library example
        run: moon run --target js examples/basic
      - name: Verify packaged library in a separate consumer workspace
        run: python tools/verify_consumer.py
      - name: Build and verify standalone offline viewer
        run: |
          python tools/build_viewer.py
          node tools/verify_viewer.cjs
      - name: Build independent asynchronous adapter
        run: python tools/build_async.py
      - name: Verify async results, cancellation, backpressure and release
        run: node tools/verify_async.mjs
      - name: Verify independent npm tarball consumption
        run: python tools/verify_async_package.py
      - name: Compare async WAL snapshots against SQLite recovery
        run: python tools/verify_async_wal.py
      - name: Generate large browser and WAL acceptance fixtures
        run: python tools/generate_browser_fixtures.py
      - name: Verify actual browser File, Blob, Worker and offline operation
        env:
          MOONSQLITE_PLAYWRIGHT: ${{ github.workspace }}/_build/browser-tools/node_modules/playwright
        run: node tools/verify_browser.cjs
      - name: Run bounded reproducible fuzzing
        run: node tools/fuzz.cjs --seed 20261003 --iterations 512
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: _build/fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve range and large-data acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: range-acceptance-${{ github.run_id }}
          path: |
            _build/wide-wal.json
            _build/large-payload.json
            _build/io-benchmark.json
            _build/inspection-evidence.json
            _build/browser-acceptance.json
            _build/browser-acceptance/fixtures.json
            _build/browser-acceptance/viewer-large.png
          if-no-files-found: ignore
          retention-days: 30
