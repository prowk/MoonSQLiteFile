name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, latest]
    env:
      MOONSQLITE_TOOLCHAIN_CHANNEL: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-acceptance
        with:
          channel: ${{ matrix.toolchain }}
      - run: moon version --all
      - name: Run complete project verification
        run: python tools/verify.py
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-failures-${{ matrix.toolchain }}-${{ github.run_id }}
          path: _build/fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve range and large-data acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: range-acceptance-${{ matrix.toolchain }}-${{ github.run_id }}
          path: |
            _build/verification/
            _build/pages/
            _build/toolchain-*.json
            _build/layout-evidence.json
            _build/wide-wal.json
            _build/large-payload.json
            _build/io-benchmark.json
            _build/compatibility-benchmark.json
            _build/inspection-evidence.json
            _build/browser-acceptance.json
            _build/browser-acceptance/fixtures.json
            _build/browser-acceptance/viewer-large.png
            _build/browser-acceptance/viewer-responsive-*.png
            _build/browser-acceptance/scale-fixtures.json
            _build/scale-acceptance.json
            _build/browser-scale-acceptance.json
          if-no-files-found: ignore
          retention-days: 30
