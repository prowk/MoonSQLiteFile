name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, latest]
    env:
      MOONSQLITE_TOOLCHAIN_CHANNEL: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.2'
      - name: Install MoonBit
        run: |
          version=$(python -c "import json; print(json.load(open('tools/toolchain.json'))['install_version'])")
          if [ "${{ matrix.toolchain }}" = latest ]; then version=latest; fi
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - name: Install pinned browser acceptance tools
        run: |
          npm install --prefix _build/browser-tools --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node _build/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Install pinned TypeScript acceptance tools
        run: npm install --prefix _build/type-tools --no-audit --no-fund --ignore-scripts typescript@5.9.3
      - name: Run complete project verification
        env:
          MOONSQLITE_PLAYWRIGHT: ${{ github.workspace }}/_build/browser-tools/node_modules/playwright
        run: python tools/verify.py
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-failures-${{ matrix.toolchain }}-${{ github.run_id }}
          path: _build/fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve range and large-data acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: range-acceptance-${{ matrix.toolchain }}-${{ github.run_id }}
          path: |
            _build/verification/
            _build/pages/
            _build/toolchain-*.json
            _build/layout-evidence.json
            _build/wide-wal.json
            _build/large-payload.json
            _build/io-benchmark.json
            _build/compatibility-benchmark.json
            _build/inspection-evidence.json
            _build/browser-acceptance.json
            _build/browser-acceptance/fixtures.json
            _build/browser-acceptance/viewer-large.png
          if-no-files-found: ignore
          retention-days: 30
